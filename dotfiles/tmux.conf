# .tmux.conf

############ BASIC REMAPPING ################
# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

########### SET GOOD OPTIONS ##################
# Use the Mouse
set -g mouse on

set -g default-command "${SHELL}"
# Enable clipboard
set -as terminal-features ',xterm-256color:clipboard'

############## TMS Session manager #############
bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S

## Pick a session
# bind-key -n C-s display-popup -E "tms switch"
## Pick a window
# bind C-w display-popup -E "tms windows".
## Kill session
# bind C-k confirm -p "Kill current session? (y/N):" "run-shell 'tms kill'"


################ WINDOWS AND PANES #############
# Random colour for each new session
set-hook -g after-new-session 'run-shell "~/.tmux-session-color.sh \"#{session_name}\""'

# Start pane numbering at 1
set -g pane-base-index 1

# Start window numbering at 1
set -g base-index 1

#set-option -g pane-active-border-style 'fg=red'


################## STATUS BAR ###################

set -g status-position bottom
set -g status-style 'fg=green'

# Left
set -g status-left-length 50
set -g status-left '#S (#P) #{?#{e|>:#{window_panes},1},#{?pane_at_right,▶,#{?pane_at_left,◀,}},} #{prefix_highlight}'

# Right
set -g status-right-length 20
# set -g status-right "#{s/.facebook.com//:host}"
set -g status-right " #(tms sessions)"

# Blank out the bit that shows the program name
set -g window-status-current-format ""

